<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Market Assistant</title>
    <style>
      /* Warm Amber Minimalist Theme */
      :root {
        --bg-color: #fdfbf7;
        --card-bg: #ffffff;
        --primary: #f59e0b;
        --primary-hover: #d97706;
        --accent-dark: #78350f;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border-color: #f3f4f6;
        --danger: #ef4444;
        --purchased-bg: #f9fafb;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 2rem 1rem;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }

      .app-shell {
        width: 100%;
        max-width: 680px;
      }

      .brand-header {
        text-align: center;
        margin-bottom: 1.75rem;
      }

      .brand-header h1 {
        font-size: 2.1rem;
        color: var(--accent-dark);
        letter-spacing: -0.5px;
      }

      .brand-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-top: 0.25rem;
      }

      /* Counter Dashboard */
      .dashboard {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .metric-card {
        flex: 1;
        background: var(--card-bg);
        padding: 1.2rem;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        border: 1px solid #f3f0e6;
        text-align: center;
      }

      .metric-card span {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
      }

      .metric-card strong {
        display: block;
        font-size: 1.8rem;
        color: var(--accent-dark);
        margin-top: 0.2rem;
      }

      /* Input & Search Section */
      .controls-panel {
        background: var(--card-bg);
        padding: 1.5rem;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        border: 1px solid #f3f0e6;
        margin-bottom: 1.5rem;
      }

      .form-group {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .pill-input {
        padding: 0.8rem 1.2rem;
        border: 1px solid #e5e7eb;
        border-radius: 30px;
        font-size: 0.95rem;
        outline: none;
        background: #fafafa;
        transition: all 0.2s;
      }

      .pill-input:focus {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
      }

      .input-name {
        flex: 2;
        min-width: 180px;
      }

      .input-quantity {
        flex: 1;
        min-width: 90px;
      }

      .btn {
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-amber {
        background-color: var(--primary);
        color: #ffffff;
      }

      .btn-amber:hover {
        background-color: var(--primary-hover);
      }

      .btn-cancel {
        background-color: #e5e7eb;
        color: var(--text-main);
      }

      .search-field {
        width: 100%;
      }

      /* Shopping Items Display */
      .items-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .item-card {
        background: var(--card-bg);
        padding: 1rem 1.25rem;
        border-radius: 14px;
        border: 1px solid #f3f0e6;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s;
      }

      .item-card.is-purchased {
        background-color: var(--purchased-bg);
        opacity: 0.75;
      }

      .item-main {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex: 1;
      }

      .toggle-checkbox {
        width: 22px;
        height: 22px;
        accent-color: var(--primary);
        cursor: pointer;
      }

      .item-title {
        font-weight: 600;
        font-size: 1rem;
      }

      .is-purchased .item-title {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .quantity-badge {
        font-size: 0.8rem;
        font-weight: 700;
        background-color: #fef3c7;
        color: var(--accent-dark);
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
      }

      .action-btns {
        display: flex;
        gap: 0.5rem;
      }

      .btn-action {
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      .btn-edit {
        background-color: #f3f4f6;
        color: var(--text-main);
      }

      .btn-edit:hover {
        background-color: #e5e7eb;
      }

      .btn-delete {
        background-color: #fee2e2;
        color: var(--danger);
      }

      .btn-delete:hover {
        background-color: var(--danger);
        color: white;
      }

      .empty-state {
        text-align: center;
        padding: 2.5rem;
        color: var(--text-muted);
        background: var(--card-bg);
        border-radius: 16px;
        border: 1px dashed #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="brand-header">
        <h1>Market List Planner</h1>
        <p>Organize your shopping items before heading to the market</p>
      </div>

      <!-- Dashboard Counter (Rubric Requirement: Total Number of Items) -->
      <div class="dashboard">
        <div class="metric-card">
          <span>Total Items</span>
          <strong id="counter-total">0</strong>
        </div>
        <div class="metric-card">
          <span>Purchased</span>
          <strong id="counter-bought">0</strong>
        </div>
      </div>

      <!-- Controls Form -->
      <div class="controls-panel">
        <form id="market-form" class="form-group">
          <input type="hidden" id="entry-id" />
          <input
            type="text"
            id="entry-name"
            class="pill-input input-name"
            placeholder="Add item (e.g., Apples)"
            required
          />
          <input
            type="number"
            id="entry-qty"
            class="pill-input input-quantity"
            placeholder="Qty"
            min="1"
            value="1"
            required
          />
          <button type="submit" id="save-button" class="btn btn-amber">
            Add Item
          </button>
          <button
            type="button"
            id="cancel-button"
            class="btn btn-cancel"
            style="display: none"
          >
            Cancel
          </button>
        </form>

        <!-- Search Field (Rubric Requirement: Search Items) -->
        <input
          type="text"
          id="filter-field"
          class="pill-input search-field"
          placeholder="Search your market list..."
        />
      </div>

      <!-- Items List Display -->
      <div id="items-list" class="items-container"></div>
    </div>

    <script>
      // Storage Key unique to this group setup
      let storageKey = "group_market_list_db";
      let marketItems = JSON.parse(localStorage.getItem(storageKey)) || [];

      const marketForm = document.getElementById("market-form");
      const entryId = document.getElementById("entry-id");
      const entryName = document.getElementById("entry-name");
      const entryQty = document.getElementById("entry-qty");
      const filterField = document.getElementById("filter-field");
      const itemsList = document.getElementById("items-list");
      const saveButton = document.getElementById("save-button");
      const cancelButton = document.getElementById("cancel-button");

      const counterTotal = document.getElementById("counter-total");
      const counterBought = document.getElementById("counter-bought");

      // Local Storage Sync
      function syncLocalStorage() {
        localStorage.setItem(storageKey, JSON.stringify(marketItems));
      }

      // Refresh Dashboard Counts
      function updateDashboard() {
        counterTotal.textContent = marketItems.length;
        counterBought.textContent = marketItems.filter((i) => i.bought).length;
      }

      // Render Items
      function renderItems(searchTerm = "") {
        itemsList.innerHTML = "";

        const filtered = marketItems.filter((item) =>
          item.name.toLowerCase().includes(searchTerm.toLowerCase()),
        );

        if (filtered.length === 0) {
          itemsList.innerHTML =
            '<div class="empty-state">No shopping items found in your list.</div>';
          updateDashboard();
          return;
        }

        filtered.forEach((item) => {
          const card = document.createElement("div");
          card.className = `item-card ${item.bought ? "is-purchased" : ""}`;

          card.innerHTML = `
          <div class="item-main">
            <input 
              type="checkbox" 
              class="toggle-checkbox" 
              ${item.bought ? "checked" : ""} 
              onchange="toggleBoughtState('${item.id}')"
            />
            <span class="item-title">${cleanInput(item.name)}</span>
            <span class="quantity-badge">Qty: ${item.quantity}</span>
          </div>
          <div class="action-btns">
            <button onclick="editEntry('${item.id}')" class="btn-action btn-edit">Edit</button>
            <button onclick="deleteEntry('${item.id}')" class="btn-action btn-delete">Delete</button>
          </div>
        `;
          itemsList.appendChild(card);
        });

        updateDashboard();
      }

      function cleanInput(str) {
        const p = document.createElement("p");
        p.textContent = str;
        return p.innerHTML;
      }

      // Add / Edit Submission Handler
      marketForm.addEventListener("submit", (evt) => {
        evt.preventDefault();

        const nameVal = entryName.value.trim();
        const qtyVal = parseInt(entryQty.value, 10);
        const currentId = entryId.value;

        if (!nameVal || isNaN(qtyVal) || qtyVal < 1) return;

        if (currentId) {
          // Edit Item
          marketItems = marketItems.map((item) =>
            item.id === currentId
              ? { ...item, name: nameVal, quantity: qtyVal }
              : item,
          );
        } else {
          // Add Item
          marketItems.push({
            id: "item_" + Date.now(),
            name: nameVal,
            quantity: qtyVal,
            bought: false,
          });
        }

        syncLocalStorage();
        clearForm();
        renderItems(filterField.value);
      });

      // Mark Purchased Toggle
      window.toggleBoughtState = function (id) {
        marketItems = marketItems.map((item) =>
          item.id === id ? { ...item, bought: !item.bought } : item,
        );
        syncLocalStorage();
        renderItems(filterField.value);
      };

      // Edit Item
      window.editEntry = function (id) {
        const item = marketItems.find((i) => i.id === id);
        if (!item) return;

        entryId.value = item.id;
        entryName.value = item.name;
        entryQty.value = item.quantity;

        saveButton.textContent = "Update Item";
        cancelButton.style.display = "inline-block";
        entryName.focus();
      };

      // Delete Item
      window.deleteEntry = function (id) {
        marketItems = marketItems.filter((item) => item.id !== id);
        syncLocalStorage();
        renderItems(filterField.value);
      };

      // Clear Form State
      function clearForm() {
        entryId.value = "";
        entryName.value = "";
        entryQty.value = "1";
        saveButton.textContent = "Add Item";
        cancelButton.style.display = "none";
      }

      cancelButton.addEventListener("click", clearForm);

      // Live Search Handler
      filterField.addEventListener("input", (e) => {
        renderItems(e.target.value);
      });

      // Initial Load
      renderItems();
    </script>
  </body>
</html>
